name: Pack TokenIDP Server NuGet

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish package to NuGet feed"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      version:
        description: "Optional exact package version, for example 1.2.3-alpha"
        required: false
        default: ""
      baseVersion:
        description: "Base version for prerelease builds"
        required: false
        default: "0.1.0"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "src/TokenIDP.Server/**"
      - "src/TokenIDP.Core/**"
      - "src/TokenIDP.Domain/**"
      - "src/TokenIDP.Infrastructure/**"
      - "src/TokenIDP.Workers/**"
      - "src/Directory.Build.props"
      - "scripts/Pack-TokenIDPServer.ps1"
      - ".github/workflows/tokenidp-server-nuget.yml"

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack package
        id: pack
        shell: pwsh
        run: >
          ./scripts/Pack-TokenIDPServer.ps1
          -Configuration Release
          -OutputDirectory artifacts/nuget
          -BaseVersion "${{ inputs.baseVersion || '0.1.0' }}"
          -Version "${{ inputs.version || '' }}"
          -PackDependencies $false

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenidp-server-nuget
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == 'true' }}
    needs: pack
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: tokenidp-server-nuget
          path: artifacts/nuget

      - name: Log in to NuGet.org with OIDC
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: naeemr

      - name: Publish package
        shell: pwsh
        run: |
          Get-ChildItem -Path artifacts/nuget -Filter "*.nupkg" | ForEach-Object {
            dotnet nuget push $_.FullName `
              --source "https://api.nuget.org/v3/index.json" `
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" `
              --skip-duplicate
          }
