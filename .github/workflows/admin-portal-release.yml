name: Release Admin Portal

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0. Defaults to the package version plus commit SHA."
        required: false
        default: ""
      createRelease:
        description: "Create or update a GitHub Release and upload the ZIP"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            PACKAGE_VERSION="$(node -p "require('./portal/package.json').version")"
            SHORT_SHA="$(git rev-parse --short=8 HEAD)"
            VERSION="${PACKAGE_VERSION}-ci.${SHORT_SHA}"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install portal dependencies
        run: npm ci
        working-directory: portal

      - name: Build admin portal
        env:
          CI: "false"
          GENERATE_SOURCEMAP: "false"
        run: npm run build
        working-directory: portal

      - name: Package admin portal ZIP
        shell: bash
        run: |
          mkdir -p artifacts/admin-portal
          cd portal/build
          zip -r "../../artifacts/admin-portal/TokenIDP.AdminPortal.${{ steps.version.outputs.version }}.zip" .

      - name: Upload admin portal artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenidp-admin-portal
          path: artifacts/admin-portal/TokenIDP.AdminPortal.*.zip
          if-no-files-found: error

      - name: Upload ZIP to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.createRelease == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ steps.version.outputs.tag }}"
          ZIP_PATH="artifacts/admin-portal/TokenIDP.AdminPortal.${{ steps.version.outputs.version }}.zip"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${ZIP_PATH}" --clobber
          else
            gh release create "${TAG_NAME}" "${ZIP_PATH}" \
              --title "TokenIDP ${{ steps.version.outputs.version }}" \
              --notes "Release assets include the self-hostable TokenIDP admin portal static bundle."
          fi
