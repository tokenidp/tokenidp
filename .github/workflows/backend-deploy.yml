name: Deploy Backend API

on:
  push:
    branches:
      - main
    paths:
      - "src/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore solution dependencies
        run: dotnet restore TokenIDP.sln
        working-directory: src

      - name: Build solution
        run: dotnet build TokenIDP.sln --configuration Release --no-restore
        working-directory: src

      - name: Publish API
        run: dotnet publish TokenIDP.Service/TokenIDP.Service.csproj --configuration Release --no-build --output "${{ github.workspace }}/publish"
        working-directory: src

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Service application settings
        if: ${{ vars.AZURE_WEBAPP_RESOURCE_GROUP != '' }}
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_RESOURCE_GROUP: ${{ vars.AZURE_WEBAPP_RESOURCE_GROUP }}
          ASPNETCORE_ENVIRONMENT_VALUE: ${{ vars.ASPNETCORE_ENVIRONMENT }}
          BOOTSTRAP_REDIRECT_URI: ${{ vars.BOOTSTRAP_REDIRECT_URI }}
          BOOTSTRAP_LOGOUT_REDIRECT_URI: ${{ vars.BOOTSTRAP_LOGOUT_REDIRECT_URI }}
          BUILD_COMMIT_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          APP_NAME="${AZURE_WEBAPP_NAME:-tresorauth}"
          ENV_NAME="${ASPNETCORE_ENVIRONMENT_VALUE:-Staging}"
          SETTINGS=(
            "ASPNETCORE_ENVIRONMENT=$ENV_NAME"
            "DOTNET_ENVIRONMENT=$ENV_NAME"
            "Build__CommitSha=$BUILD_COMMIT_SHA"
            "Build__RunId=$BUILD_RUN_ID"
          )

          if [ -n "$BOOTSTRAP_REDIRECT_URI" ]; then
            SETTINGS+=("Bootstrap__RedirectUri=$BOOTSTRAP_REDIRECT_URI")
          fi

          if [ -n "$BOOTSTRAP_LOGOUT_REDIRECT_URI" ]; then
            SETTINGS+=("Bootstrap__LogoutRedirectUri=$BOOTSTRAP_LOGOUT_REDIRECT_URI")
          fi

          az webapp config appsettings set \
            --name "$APP_NAME" \
            --resource-group "$AZURE_WEBAPP_RESOURCE_GROUP" \
            --settings "${SETTINGS[@]}"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: "tresorauth"
          package: "${{ github.workspace }}/publish"
