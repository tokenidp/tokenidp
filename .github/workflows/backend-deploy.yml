name: Deploy Backend API

on:
  push:
    branches:
      - main
    paths:
      - "src/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore solution dependencies
        run: dotnet restore TokenIDP.sln
        working-directory: src

      - name: Build solution
        run: dotnet build TokenIDP.sln --configuration Release --no-restore
        working-directory: src

      - name: Publish API
        run: dotnet publish TokenIDP.Service/TokenIDP.Service.csproj --configuration Release --no-build --output "${{ github.workspace }}/publish"
        working-directory: src

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: "tresorauth"
          package: "${{ github.workspace }}/publish"
