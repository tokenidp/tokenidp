name: Release Angular SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional npm SDK version. Defaults to sdks/angular-idp-sdk/package.json."
        required: false
        default: ""
      publish:
        description: "Publish tokenidp-angular to npm using trusted publishing"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - "angular-sdk-v*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install SDK dependencies
        run: npm ci
        working-directory: sdks/angular-idp-sdk

      - name: Resolve SDK version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/angular-sdk-v* ]]; then
            VERSION="${GITHUB_REF_NAME#angular-sdk-v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi

          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
        working-directory: sdks/angular-idp-sdk

      - name: Build SDK
        run: npm run build
        working-directory: sdks/angular-idp-sdk

      - name: Pack SDK artifact
        run: |
          mkdir -p ../../artifacts/angular-sdk
          npm pack ./dist --pack-destination ../../artifacts/angular-sdk
        working-directory: sdks/angular-idp-sdk

      - name: Upload SDK package artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenidp-angular-sdk
          path: artifacts/angular-sdk/*.tgz
          if-no-files-found: error

      - name: Publish SDK to npm
        if: ${{ startsWith(github.ref, 'refs/tags/angular-sdk-v') || inputs.publish == 'true' }}
        run: npm publish ./dist --access public
        working-directory: sdks/angular-idp-sdk
