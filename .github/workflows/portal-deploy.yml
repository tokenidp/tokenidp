name: Deploy Portal

on:
  push:
    branches:
      - main
    paths:
      - "portal/**"
      - "sdks/**"
      - ".github/workflows/portal-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: portal

      - name: Generate runtime config
        env:
          REACT_APP_DEPLOYMENT_ENV: ${{ vars.REACT_APP_DEPLOYMENT_ENV }}
          REACT_APP_BASE_URL: ${{ vars.REACT_APP_BASE_URL }}
          REACT_APP_AUTH_BASE_URL: ${{ vars.REACT_APP_AUTH_BASE_URL }}
          REACT_APP_TENANT_PROPAGATION_MODE: ${{ vars.REACT_APP_TENANT_PROPAGATION_MODE }}
          REACT_APP_OAUTH_CLIENT_ID: ${{ vars.REACT_APP_OAUTH_CLIENT_ID }}
          REACT_APP_OAUTH_REDIRECT_URI: ${{ vars.REACT_APP_OAUTH_REDIRECT_URI }}
          REACT_APP_OAUTH_POST_LOGOUT_REDIRECT_URI: ${{ vars.REACT_APP_OAUTH_POST_LOGOUT_REDIRECT_URI }}
          REACT_APP_OAUTH_SCOPE: ${{ vars.REACT_APP_OAUTH_SCOPE }}
        run: |
          DEPLOYMENT_ENV="${REACT_APP_DEPLOYMENT_ENV:-staging}"
          BASE_URL="${REACT_APP_BASE_URL:-https://tokenidp-api-dtbce3asgqdqe5a6.canadacentral-01.azurewebsites.net}"
          AUTH_BASE_URL="${REACT_APP_AUTH_BASE_URL:-https://tokenidp-api-dtbce3asgqdqe5a6.canadacentral-01.azurewebsites.net}"
          TENANT_PROPAGATION_MODE="${REACT_APP_TENANT_PROPAGATION_MODE:-none}"
          CLIENT_ID="${REACT_APP_OAUTH_CLIENT_ID:-idp-admin}"
          REDIRECT_URI="${REACT_APP_OAUTH_REDIRECT_URI:-https://ashy-meadow-06d616803.7.azurestaticapps.net/auth/callback}"
          POST_LOGOUT_REDIRECT_URI="${REACT_APP_OAUTH_POST_LOGOUT_REDIRECT_URI:-https://ashy-meadow-06d616803.7.azurestaticapps.net/login}"
          OAUTH_SCOPE="${REACT_APP_OAUTH_SCOPE:-openid profile tokenidp.admin.write tokenidp.admin.read}"
          cat > .env.production <<EOF
          GENERATE_SOURCEMAP=false
          EOF
          cat > public/config.json <<EOF
          {
            "deploymentEnvironment": "${DEPLOYMENT_ENV}",
            "baseUrl": "${BASE_URL}",
            "authority": "${AUTH_BASE_URL}",
            "tenantPropagationMode": "${TENANT_PROPAGATION_MODE}",
            "tenantQueryParameter": "tenant",
            "userPermissionsPath": "admin/user/permissions",
            "clientId": "${CLIENT_ID}",
            "redirectUri": "${REDIRECT_URI}",
            "postLoginRedirectUri": "/dashboard",
            "postLogoutRedirectUri": "${POST_LOGOUT_REDIRECT_URI}",
            "scope": "${OAUTH_SCOPE}"
          }
          EOF
        working-directory: portal

      - name: Build React frontend
        env:
          CI: "false"
        run: npm run build
        working-directory: portal

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/portal/build"
          skip_app_build: true
