name: Deploy Portal

on:
  push:
    branches:
      - main
    paths:
      - "portal/**"
      - "sdks/**"
      - ".github/workflows/portal-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: portal

      - name: Generate production env file
        env:
          REACT_APP_DEPLOYMENT_ENV: ${{ vars.REACT_APP_DEPLOYMENT_ENV }}
          REACT_APP_BASE_URL: ${{ vars.REACT_APP_BASE_URL }}
          REACT_APP_AUTH_BASE_URL: ${{ vars.REACT_APP_AUTH_BASE_URL }}
          REACT_APP_OAUTH_CLIENT_ID: ${{ vars.REACT_APP_OAUTH_CLIENT_ID }}
          REACT_APP_OAUTH_REDIRECT_URI: ${{ vars.REACT_APP_OAUTH_REDIRECT_URI }}
          REACT_APP_OAUTH_POST_LOGOUT_REDIRECT_URI: ${{ vars.REACT_APP_OAUTH_POST_LOGOUT_REDIRECT_URI }}
          REACT_APP_OAUTH_SCOPE: ${{ vars.REACT_APP_OAUTH_SCOPE }}
          REACT_APP_OAUTH_CODE_VERIFIER_KEY: ${{ vars.REACT_APP_OAUTH_CODE_VERIFIER_KEY }}
        run: |
          DEPLOYMENT_ENV="${REACT_APP_DEPLOYMENT_ENV:-staging}"
          BASE_URL="${REACT_APP_BASE_URL:-https://tresorauth-fxh4budpa9hha4db.canadacentral-01.azurewebsites.net}"
          AUTH_BASE_URL="${REACT_APP_AUTH_BASE_URL:-https://tresorauth-fxh4budpa9hha4db.canadacentral-01.azurewebsites.net}"
          CLIENT_ID="${REACT_APP_OAUTH_CLIENT_ID:-idp-admin}"
          REDIRECT_URI="${REACT_APP_OAUTH_REDIRECT_URI:-https://ashy-meadow-06d616803.7.azurestaticapps.net/auth/callback}"
          POST_LOGOUT_REDIRECT_URI="${REACT_APP_OAUTH_POST_LOGOUT_REDIRECT_URI:-https://ashy-meadow-06d616803.7.azurestaticapps.net/login}"
          OAUTH_SCOPE="${REACT_APP_OAUTH_SCOPE:-openid profile email offline_access tokenidp.admin.write tokenidp.admin.read}"
          CODE_VERIFIER_KEY="${REACT_APP_OAUTH_CODE_VERIFIER_KEY:-pkce_code_verifier}"
          cat > .env.production <<EOF
          GENERATE_SOURCEMAP=false
          REACT_APP_DEPLOYMENT_ENV=${DEPLOYMENT_ENV}
          REACT_APP_BASE_URL=${BASE_URL}
          REACT_APP_AUTH_BASE_URL=${AUTH_BASE_URL}
          REACT_APP_OAUTH_CLIENT_ID=${CLIENT_ID}
          REACT_APP_OAUTH_REDIRECT_URI=${REDIRECT_URI}
          REACT_APP_OAUTH_POST_LOGOUT_REDIRECT_URI=${POST_LOGOUT_REDIRECT_URI}
          REACT_APP_OAUTH_SCOPE=${OAUTH_SCOPE}
          REACT_APP_OAUTH_CODE_VERIFIER_KEY=${CODE_VERIFIER_KEY}
          EOF
        working-directory: portal

      - name: Build React frontend
        env:
          CI: "false"
        run: npm run build
        working-directory: portal

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/portal/build"
          skip_app_build: true
